name: Android CI Build

run-name: Build optimized release APK

on:
  push:
    branches: ["main", "master", "global-reconstruction-engine"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install SDK platform, build-tools, NDK + CMake
        shell: bash
        run: |
          set -euo pipefail
          packages=(
            "platforms;android-34"
            "build-tools;34.0.0"
            "ndk;27.0.12077973"
            "cmake;3.22.1"
          )

          # Retry interrupted downloads; clear incomplete SDK cache between attempts.
          for attempt in 1 2 3; do
            echo "Android SDK installation attempt ${attempt}/3"
            # sdkmanager can finish successfully before the yes process exits.
            # Ignore yes' expected SIGPIPE and use sdkmanager's exit status.
            set +o pipefail
            if yes | sdkmanager --install "${packages[@]}"; then
              set -o pipefail
              exit 0
            else
              install_status=$?
              set -o pipefail
            fi
            if [ "${attempt}" -lt 3 ]; then
              rm -rf "${ANDROID_SDK_ROOT}/.temp" "${HOME}/.android/cache"
              sleep $((attempt * 10))
            fi
          done
          echo "Android SDK installation failed after 3 attempts (sdkmanager exit: ${install_status})."
          exit 1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper executable
        run: chmod +x ./gradlew

      - name: Show Gradle version
        run: ./gradlew --version

      - name: Run tracking engine unit tests
        run: ./gradlew testReleaseUnitTest --stacktrace --no-daemon

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: trackstudio-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload CMake/NDK logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-build-logs
          path: |
            app/.cxx/**/*.log
            app/build/intermediates/cxx/**
          if-no-files-found: ignore
